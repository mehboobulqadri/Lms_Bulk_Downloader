<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LMS Downloader</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .badge {
      margin-left: auto;
      font-size: 10px;
      font-weight: 600;
      background: #eff6ff;
      color: #2563eb;
      padding: 2px 8px;
      border-radius: 12px;
    }

    /* ── Header ── */
    .header {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      flex-shrink: 0;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(37, 99, 235, .3);
    }

    .header h1 {
      font-size: 19px;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: -.4px;
    }

    .header .course {
      font-size: 13px;
      font-weight: 500;
      color: #64748b;
      margin-top: 3px;
    }

    /* ── Progress ── */
    .progress-area {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 28px 40px;
    }

    .progress-bar-outer {
      width: 100%;
      height: 24px;
      background: #f1f5f9;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      border: 1px solid #e2e8f0;
    }

    .progress-bar-inner {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #3b82f6, #1d4ed8);
      border-radius: 12px;
      transition: width .35s ease;
    }

    .progress-bar-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #0f172a;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      margin-top: 16px;
      padding: 14px 18px;
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      border-radius: 10px;
      font-size: 13px;
      color: #64748b;
    }

    .stats span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .stats strong {
      color: #0f172a;
      font-weight: 700;
      font-size: 14px;
    }

    /* ── Control bar ── */
    .ctrl-bar {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 14px 40px;
      display: flex;
      gap: 10px;
      align-items: center;
      position: sticky;
      top: 93px;
      z-index: 9;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .btn-warn {
      background: #fffbeb;
      color: #d97706;
      border: 1px solid #fde68a;
    }

    .btn-warn:hover {
      background: #fef3c7;
    }

    .btn-danger {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    .btn-danger:hover {
      background: #fee2e2;
    }

    .btn-success {
      background: #10b981;
      color: #fff;
    }

    .btn-success:hover {
      background: #059669;
      transform: translateY(-1px);
    }

    .btn-save {
      margin-left: auto;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, .25);
    }

    .btn-save:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, .35);
    }

    .btn-disabled {
      opacity: .45;
      pointer-events: none;
    }

    /* ── File list ── */
    .file-list {
      flex: 1;
      overflow-y: auto;
      padding: 20px 40px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 18px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 13px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .02);
      transition: all .15s;
    }

    .file-item:hover {
      border-color: #cbd5e1;
      transform: translateX(3px);
    }

    .file-item .icon {
      font-size: 18px;
      flex-shrink: 0;
    }

    .file-item .name {
      flex: 1;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-item .size {
      color: #64748b;
      min-width: 70px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .file-item .status {
      min-width: 90px;
      text-align: right;
      font-weight: 600;
      font-size: 12px;
    }

    .status-pending {
      color: #94a3b8;
    }

    .status-downloading {
      color: #3b82f6;
    }

    .status-done {
      color: #10b981;
    }

    .status-error {
      color: #ef4444;
    }

    /* pulsing dot for active downloads */
    .status-downloading::after {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3b82f6;
      margin-left: 5px;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from {
        opacity: .3;
      }

      to {
        opacity: 1;
      }
    }

    /* ── Banners ── */
    .done-banner {
      display: none;
      padding: 28px 40px;
      text-align: center;
      background: linear-gradient(to right, #ecfdf5, #d1fae5);
      border-bottom: 1px solid #a7f3d0;
    }

    .done-banner h2 {
      color: #047857;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .done-banner p {
      color: #059669;
      font-size: 14px;
      font-weight: 500;
    }

    .error-banner {
      display: none;
      margin: 20px 40px 0;
      padding: 16px 20px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      color: #991b1b;
      font-size: 13px;
      white-space: pre-line;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="header-icon">⬇</div>
    <div>
      <h1>LMS Downloader</h1>
      <div class="course" id="course-name">Loading…</div>
    </div>
    <span class="badge" id="app-version"></span>
  </div>

  <div class="progress-area">
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="pbar"></div>
      <div class="progress-bar-text" id="ptext">0%</div>
    </div>
    <div class="stats">
      <span>Files: <strong id="stat-files">0 / 0</strong></span>
      <span>Downloaded: <strong id="stat-bytes">0 B</strong></span>
      <span>Speed: <strong id="stat-speed">–</strong></span>
      <span>ETA: <strong id="stat-eta">–</strong></span>
      <span>Parallel: <strong id="stat-conc">12</strong></span>
    </div>
  </div>

  <div class="ctrl-bar">
    <button class="btn-warn" id="btn-pause">⏸ Pause</button>
    <button class="btn-danger" id="btn-cancel">✖ Cancel</button>
    <button class="btn-save btn-disabled" id="btn-save">💾 Save ZIP</button>
  </div>

  <div class="done-banner" id="done-banner">
    <h2>✅ Complete!</h2>
    <p id="done-text"></p>
  </div>
  <div class="error-banner" id="error-banner"></div>

  <div class="file-list" id="file-list"></div>

  <script src="lib/jszip.min.js"></script>
  <script src="utils.js"></script>
  <script src="storage.js"></script>
  <script src="downloader.js"></script>
</body>

</html>
